version: "2"

run:
  timeout: 10m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - durationcheck
    - errname
    - errorlint
    - fatcontext
    - gocritic
    - gocyclo
    - misspell
    - noctx
    - nilerr
    - prealloc
    - revive
    - unconvert
    - unparam
    - usestdlibvars
