services:
  renovate-operator:
    build: .
    container_name: renovate-docker-operator
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      # Required
      PLATFORM_ENDPOINT: "https://git.example.com"
      RENOVATE_TOKEN: "${RENOVATE_TOKEN}"

      # Optional overrides
      PLATFORM: "forgejo"
      RENOVATE_IMAGE: "renovate/renovate:latest"
      CRON_SCHEDULE: "0 */4 * * *"
      GLOBAL_PARALLELISM_LIMIT: "2"
      SERVER_PORT: "8081"
      LOG_LEVEL: "info"

      # Webhook (enabled by default)
      WEBHOOK_SERVER_ENABLED: "true"
      # WEBHOOK_SECRET: "${WEBHOOK_SECRET}"

      # Auth (optional — leave blank for no-auth mode)
      # OIDC_ISSUER_URL: "https://git.example.com/"
      # OIDC_CLIENT_ID: "renovate-operator"
      # OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET}"
      # OIDC_REDIRECT_URL: "http://localhost:8081/auth/callback"
      # SESSION_SECRET: "${SESSION_SECRET}"

      # Discovery filters (optional)
      # RENOVATE_DISCOVERY_FILTERS: "org1/*,org2/repo-*"
      # AUTODISCOVER_SKIP_FORKS: "true"
    volumes:
      # Persist SQLite database
      - operator-data:/data
      # Docker socket for container management
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - renovate

  # Optional: use Forgejo as OIDC provider
  # forgejo:
  #   image: codeberg.org/forgejo/forgejo:11
  #   ...

volumes:
  operator-data:
    driver: local
  renovate-cache:
    driver: local

networks:
  renovate:
    driver: bridge
