services:
  renovate-operator:
    build: .
    # or pre-built image
    #image: git.h.oluflorenzen.de/finkregh/renovate-docker-operator:latest
    container_name: renovate-docker-operator
    restart: unless-stopped
    ports:
      - "${ROP_SERVER_PORT:-8081}:${ROP_SERVER_PORT:-8081}"
    environment:
      # These have to be changed!
      ROP_PLATFORM_ENDPOINT: "${ROP_PLATFORM_ENDPOINT}"
      RENOVATE_TOKEN: "FIXME"

      # Spawned renovate containers will join this network (same as the compose-network below)
      ROP_CONTAINER_NETWORK: "renovate"

      # Optional overrides (uncomment to diverge from Dockerfile defaults)
      # RENOVATE_PLATFORM: "forgejo"
      # ROP_IMAGE: "renovate/renovate:latest"
      # ROP_CRON_SCHEDULE: "0 */4 * * *"
      # ROP_PARALLELISM: "2"
      # ROP_SERVER_PORT: "8081"
      # ROP_LOG_LEVEL: "info"
      # ROP_WEBHOOK_ENABLED: "true"
      # ROP_WEBHOOK_SECRET: ""
      # ROP_OIDC_ISSUER_URL: ""
      # ROP_OIDC_CLIENT_ID: ""
      # ROP_OIDC_CLIENT_SECRET: ""
      # ROP_OIDC_REDIRECT_URL: ""
      # ROP_SESSION_SECRET: ""
      # ROP_DISCOVERY_FILTERS: ""
      # ROP_SKIP_FORKS: "false"
      # RENOVATE_LOG_LEVEL: "debug"  # Override container log level
    volumes:
      # Persist SQLite database
      - operator-data:/data
      # Docker socket for container management
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - renovate

volumes:
  operator-data:
    driver: local

networks:
  renovate:
    driver: bridge
