services:
  renovate-operator:
    build: .
    container_name: renovate-docker-operator
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8081}:${SERVER_PORT:-8081}"
    environment:
      # Required
      PLATFORM_ENDPOINT: "${PLATFORM_ENDPOINT:-https://git.example.com}"
      RENOVATE_TOKEN: "${RENOVATE_TOKEN}"

      # Optional overrides
      PLATFORM: "${PLATFORM:-forgejo}"
      RENOVATE_IMAGE: "${RENOVATE_IMAGE:-renovate/renovate:latest}"
      CRON_SCHEDULE: "${CRON_SCHEDULE:-0 */4 * * *}"
      GLOBAL_PARALLELISM_LIMIT: "${GLOBAL_PARALLELISM_LIMIT:-2}"
      SERVER_PORT: "${SERVER_PORT:-8081}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      CONTAINER_NETWORK: "renovate"

      # Webhook (enabled by default)
      WEBHOOK_SERVER_ENABLED: "${WEBHOOK_SERVER_ENABLED:-true}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:-}"

      # Auth (optional — leave blank for no-auth mode)
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_REDIRECT_URL: "${OIDC_REDIRECT_URL:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"

      # Discovery filters (optional)
      RENOVATE_DISCOVERY_FILTERS: "${RENOVATE_DISCOVERY_FILTERS:-}"
      AUTODISCOVER_SKIP_FORKS: "${AUTODISCOVER_SKIP_FORKS:-false}"
    volumes:
      # Persist SQLite database
      - operator-data:/data
      # Docker socket for container management
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - renovate

volumes:
  operator-data:
    driver: local

networks:
  renovate:
    driver: bridge
