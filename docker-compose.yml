services:
  renovate-operator:
    build: .
    # or pre-built image
    #image: git.h.oluflorenzen.de/finkregh/renovate-docker-operator:latest
    container_name: renovate-docker-operator
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8081}:${SERVER_PORT:-8081}"
    environment:
      # These have to be changed!
      PLATFORM_ENDPOINT: "${PLATFORM_ENDPOINT}"
      RENOVATEOP_TOKEN: "FIXME"

      # Spawned renovate containers will join this network (same as the compose-network below)
      CONTAINER_NETWORK: "renovate"

      # Optional overrides (uncomment to diverge from Dockerfile defaults)
      # PLATFORM: "forgejo"
      # RENOVATEOP_IMAGE: "renovate/renovate:latest"
      # CRON_SCHEDULE: "0 */4 * * *"
      # GLOBAL_PARALLELISM_LIMIT: "2"
      # SERVER_PORT: "8081"
      # RENOVATEOP_LOG_LEVEL: "info"
      # WEBHOOK_SERVER_ENABLED: "true"
      # WEBHOOK_SECRET: ""
      # OIDC_ISSUER_URL: ""
      # OIDC_CLIENT_ID: ""
      # OIDC_CLIENT_SECRET: ""
      # OIDC_REDIRECT_URL: ""
      # SESSION_SECRET: ""
      # RENOVATEOP_DISCOVERY_FILTERS: ""
      # AUTODISCOVER_SKIP_FORKS: "false"
    volumes:
      # Persist SQLite database
      - operator-data:/data
      # Docker socket for container management
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - renovate

volumes:
  operator-data:
    driver: local

networks:
  renovate:
    driver: bridge
