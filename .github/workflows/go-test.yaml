name: GO lint & test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: node:26-bookworm@sha256:a546d3f8acd2af4382668a7e6acd3bc4418e6a27478373e3246f8162f5181509

    steps:
      - uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: https://github.com/actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          # Justfile pins the lint/test tools, so its contents are part of the key.
          cache-dependency-path: |
            go.sum
            Justfile

      - name: Install just
        uses: https://codeberg.org/FelixSchwarz/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.59.0"

      - name: Download dependencies
        run: go mod download

      # golangci-lint keeps its own analysis cache (~20-30s on repeat runs).
      - name: Cache golangci-lint analysis
        uses: https://code.forgejo.org/actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('Justfile') }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-

      - name: Lint
        run: |
          export GOLANGCI_LINT_CACHE="${HOME}/.cache/golangci-lint"
          just golangci-lint

      - name: Test
        run: just test-unit

      - name: Build (linux/amd64)
        run: just build-linux-amd64
