name: GO lint & test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  GO_VERSION: "1.25.0"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm

    steps:
      - uses: https://code.forgejo.org/actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v6.0.2

      - name: Install Go
        run: |
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | tar -C /usr/local -xz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -tags timetzdata ./...

  test:
    needs: [build]
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm

    steps:
      - uses: https://code.forgejo.org/actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v6.0.2

      - name: Install Go
        run: |
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | tar -C /usr/local -xz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test ./... -v

  lint:
    needs: [build]
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm

    steps:
      - uses: https://code.forgejo.org/actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v6.0.2

      - name: Install Go
        run: |
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | tar -C /usr/local -xz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b /usr/local/bin

      - name: Lint
        run: golangci-lint run --timeout=10m --config=.golangci.yml
