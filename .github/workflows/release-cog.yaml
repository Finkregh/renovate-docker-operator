name: release

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  release-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> "$GITHUB_OUTPUT"
        id: extract_branch

      - name: Checkout
        id: checkout
        uses: https://code.forgejo.org/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ steps.extract_branch.outputs.branch }}
          token: ${{ secrets.USER_PUSH_TOKEN }}
      - name: Generate release with changelog
        uses: https://git.h.oluflorenzen.de/finkregh/actions/actions/release-with-cog@813c133c61aa1a5bd8a0f5ae6938313715324995 # feat/split-tokens
        with:
          # One token drives both the PR changelog comment and the tag/release
          # creation. Comments need issue write (USER_PUSH_TOKEN got 403), which
          # a repo-scoped token cannot grant here; on PR events use the global
          # comment token, and the package/release token for real releases.
          package_tag_changelog_token: ${{ github.event_name == 'pull_request' && secrets.GLOBAL_COMMENT_TOKEN || secrets.PACKAGE_UPLOAD_TOKEN }}
