name: Build & Release (Production)

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

env:
  REGISTRY: ghcr.io

jobs:
  build-operator:
    uses: https://github.com/mogenius/github-actions/.github/workflows/build-multiarch.yml@9bbef6f2531206a2cc3e41b0649704a80f2d4185 # v1.7.0
    secrets: inherit
    with:
      version: ${{ github.ref_name }}
      image: ghcr.io/oluf-tech/renovate-docker-operator
      push_latest: true
