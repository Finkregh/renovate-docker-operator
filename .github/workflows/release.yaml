name: Build & Release (tag)

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

jobs:
  build-binary:
    name: Build Go binary
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm

    steps:
      - uses: https://code.forgejo.org/actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v6.0.2
        with:
          fetch-tags: true
          fetch-depth: 10

      - name: Setup Go
        uses: https://github.com/actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: |
          VERSION="${{ github.ref_name }}"
          CGO_ENABLED=0 go build -tags timetzdata \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o renovate-operator ./cmd/

      - name: Upload binary artifact
        uses: https://code.forgejo.org/actions/upload-artifact@v4
        with:
          name: renovate-operator-linux-amd64
          path: renovate-operator

  build-container:
    name: Build & push container image
    runs-on: ubuntu-latest
    env:
      DOCKER_HOST: tcp://docker_dind:2375
    container:
      image: node:24-bookworm@sha256:8530f76a96d88820d288761f022e318970dda93d01536919fbc16076b7983e63
      options: >-
        --privileged
      env:
        DOCKER_HOST: tcp://docker_dind:2375

    steps:
      - name: Get server domain
        id: server_domain
        shell: bash
        run: |
          echo "server_domain=$(echo '${{ github.api_url }}' | awk -F'[/:]' '{print $4}')" >> "$GITHUB_OUTPUT"

      - uses: https://code.forgejo.org/actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v6.0.2
        with:
          fetch-tags: true
          fetch-depth: 10

      - name: Install Docker
        run: |
          apt-get update
          apt-get install -y ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian \
            $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
            tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update
          apt-get install -y docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      - name: Setup Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@f211e3e9ded2d9377c8cadc4489a4e38014bc4c9 # v1

      - name: Login to Container Registry
        uses: https://github.com/docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ steps.server_domain.outputs.server_domain }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PACKAGE_UPLOAD_TOKEN }}

      - name: Build and Push
        uses: https://github.com/docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.server_domain.outputs.server_domain }}/${{ github.repository }}:${{ github.ref_name }}
            ${{ steps.server_domain.outputs.server_domain }}/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
