name: Build & Release (tag)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'

jobs:
  build-and-release:
    name: Build binaries & attach to release
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm

    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-tags: true
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Go
        uses: https://github.com/actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install just
        uses: https://github.com/extractions/setup-just@e33e0265a09d0d9e33f4d1a10e96956f55c0283e # v4.0.0

      - name: Download dependencies
        run: go mod download

      - name: Build all binaries
        run: just build-all

      - name: Generate checksums
        run: |
          cd dist
          sha256sum amd64/renovate-operator arm64/renovate-operator armv7/renovate-operator \
            | sed 's|amd64/renovate-operator|renovate-operator-linux-amd64|;s|arm64/renovate-operator|renovate-operator-linux-arm64|;s|armv7/renovate-operator|renovate-operator-linux-armv7|' \
            > checksums.txt

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Find release by tag
        id: release
        env:
          TOKEN: ${{ secrets.PACKAGE_UPLOAD_TOKEN }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          RELEASE_ID=$(curl -s --fail \
            -H "Authorization: token ${TOKEN}" \
            "${SERVER}/api/v1/repos/${REPO}/releases/tags/${VERSION}" \
            | jq -r '.id')
          echo "RELEASE_ID=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

      - name: Attach binaries to release
        env:
          TOKEN: ${{ secrets.PACKAGE_UPLOAD_TOKEN }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.release.outputs.RELEASE_ID }}
        run: |
          for arch in amd64 arm64 armv7; do
            curl -s --fail -X POST \
              -H "Authorization: token ${TOKEN}" \
              -F "attachment=@dist/${arch}/renovate-operator" \
              "${SERVER}/api/v1/repos/${REPO}/releases/${RELEASE_ID}/assets?name=renovate-operator-linux-${arch}"
          done
          curl -s --fail -X POST \
            -H "Authorization: token ${TOKEN}" \
            -F "attachment=@dist/checksums.txt" \
            "${SERVER}/api/v1/repos/${REPO}/releases/${RELEASE_ID}/assets?name=checksums.txt"

      - name: Upload to Generic Package Registry
        env:
          TOKEN: ${{ secrets.PACKAGE_UPLOAD_TOKEN }}
          SERVER: ${{ github.server_url }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          BASE_URL="${SERVER}/api/packages/${OWNER}/generic/renovate-docker-operator/${VERSION}"
          for arch in amd64 arm64 armv7; do
            curl -s --fail -X PUT \
              -H "Authorization: token ${TOKEN}" \
              --upload-file "dist/${arch}/renovate-operator" \
              "${BASE_URL}/renovate-operator-linux-${arch}"
          done
          curl -s --fail -X PUT \
            -H "Authorization: token ${TOKEN}" \
            --upload-file "dist/checksums.txt" \
            "${BASE_URL}/checksums.txt"

  build-container:
    name: Build & push container image
    runs-on: ubuntu-latest
    env:
      DOCKER_HOST: tcp://docker_dind:2375
    container:
      image: node:24-bookworm@sha256:8530f76a96d88820d288761f022e318970dda93d01536919fbc16076b7983e63
      options: >-
        --privileged
      env:
        DOCKER_HOST: tcp://docker_dind:2375

    steps:
      - name: Get server domain
        id: server_domain
        shell: bash
        run: |
          echo "server_domain=$(echo '${{ github.api_url }}' | awk -F'[/:]' '{print $4}')" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-tags: true
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Install Docker
        run: |
          apt-get update
          apt-get install -y ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian \
            $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
            tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update
          apt-get install -y docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      - name: Setup Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to Container Registry
        uses: https://github.com/docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ steps.server_domain.outputs.server_domain }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PACKAGE_UPLOAD_TOKEN }}

      - name: Build and Push
        uses: https://github.com/docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.server_domain.outputs.server_domain }}/${{ github.repository }}:${{ github.ref_name }}
            ${{ steps.server_domain.outputs.server_domain }}/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
