name: Build & Release (tag)

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-and-release:
    name: Build binaries & attach to release
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm@sha256:5711a0d445a1af54af9589066c646df387d1831a608226f4cd694fc59e745059

    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-tags: true
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Go
        uses: https://github.com/actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install just
        uses: https://codeberg.org/FelixSchwarz/setup-just@v4.0.0-codeberg

      - name: Install jq
        uses: https://git.h.oluflorenzen.de/mirrors/codeberg.PurpleBooth.common-pipelines/actions/install-jq@613f8b1be709aae90bc082b1ea389887431b9ae3 # 0.31.3

      - name: Download dependencies
        run: go mod download

      - name: Build all binaries
        run: just build-all

      - name: Generate checksums
        run: |
          cd dist
          sha256sum amd64/renovate-operator arm64/renovate-operator armv7/renovate-operator \
            | sed 's|amd64/renovate-operator|renovate-operator-linux-amd64|;s|arm64/renovate-operator|renovate-operator-linux-arm64|;s|armv7/renovate-operator|renovate-operator-linux-armv7|' \
            > checksums.txt

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload to Generic Package Registry
        env:
          TOKEN: ${{ secrets.PACKAGE_UPLOAD_TOKEN }}
          SERVER: ${{ github.server_url }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          BASE_URL="${SERVER}/api/packages/${OWNER}/generic/renovate-docker-operator/${VERSION}"
          for arch in amd64 arm64 armv7; do
            curl -s --fail -X PUT \
              -H "Authorization: token ${TOKEN}" \
              --upload-file "dist/${arch}/renovate-operator" \
              "${BASE_URL}/renovate-operator-linux-${arch}"
          done
          curl -s --fail -X PUT \
            -H "Authorization: token ${TOKEN}" \
            --upload-file "dist/checksums.txt" \
            "${BASE_URL}/checksums.txt"

  build-container:
    uses: ./.github/workflows/reusable-build-image.yaml
    with:
      tag_suffixes: |
        ${{ github.ref_name }}
        latest
      checkout_ref: ${{ github.event.release.tag_name || github.ref }}
      fetch_tags: true
    secrets:
      PACKAGE_UPLOAD_TOKEN: ${{ secrets.PACKAGE_UPLOAD_TOKEN }}
