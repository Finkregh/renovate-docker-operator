name: Build & Release (tag)

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+\.[0-9]+\.[0-9]+'

jobs:
  build-binary:
    name: Build Go binary
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm

    steps:
      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> "$GITHUB_OUTPUT"
        id: extract_branch

      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v6.0.2
        id: checkout
        with:
          fetch-tags: true
          fetch-depth: 0
          ref: ${{ steps.extract_branch.outputs.branch }}

      - name: Setup Go
        uses: https://github.com/actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: |
          VERSION="${{ github.ref_name }}"
          CGO_ENABLED=0 go build -tags timetzdata \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o renovate-operator ./cmd/

      - name: Upload binary artifact
        uses: https://code.forgejo.org/actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: renovate-operator-linux-amd64
          path: renovate-operator

  build-container:
    name: Build & push container image
    runs-on: ubuntu-latest
    env:
      DOCKER_HOST: tcp://docker_dind:2375
    container:
      image: node:24-bookworm@sha256:8530f76a96d88820d288761f022e318970dda93d01536919fbc16076b7983e63
      options: >-
        --privileged
      env:
        DOCKER_HOST: tcp://docker_dind:2375

    steps:
      - name: Get server domain
        id: server_domain
        shell: bash
        run: |
          echo "server_domain=$(echo '${{ github.api_url }}' | awk -F'[/:]' '{print $4}')" >> "$GITHUB_OUTPUT"

      - uses: https://code.forgejo.org/actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v6.0.2
        with:
          fetch-tags: true
          fetch-depth: 10

      - name: Install Docker
        run: |
          apt-get update
          apt-get install -y ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian \
            $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
            tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update
          apt-get install -y docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      - name: Setup Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to Container Registry
        uses: https://github.com/docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ steps.server_domain.outputs.server_domain }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PACKAGE_UPLOAD_TOKEN }}

      - name: Build and Push
        uses: https://github.com/docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.server_domain.outputs.server_domain }}/${{ github.repository }}:${{ github.ref_name }}
            ${{ steps.server_domain.outputs.server_domain }}/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
