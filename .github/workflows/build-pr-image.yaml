name: Build PR Image

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-container:
    name: Build & push PR container image
    runs-on: ubuntu-latest
    env:
      DOCKER_HOST: tcp://docker_dind:2375
    container:
      image: node:24-bookworm@sha256:8530f76a96d88820d288761f022e318970dda93d01536919fbc16076b7983e63
      options: >-
        --privileged
      env:
        DOCKER_HOST: tcp://docker_dind:2375

    steps:
      - name: Get server domain
        id: server_domain
        shell: bash
        run: |
          echo "server_domain=$(echo '${{ github.api_url }}' | awk -F'[/:]' '{print $4}')" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Docker
        run: |
          apt-get update
          apt-get install -y ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo \
            "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian \
            $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
            tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update
          apt-get install -y docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      - name: Setup Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to Container Registry
        uses: https://github.com/docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ steps.server_domain.outputs.server_domain }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PACKAGE_UPLOAD_TOKEN }}

      - name: Build and Push
        uses: https://github.com/docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.server_domain.outputs.server_domain }}/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comment image tag on PR
        env:
          TOKEN: ${{ secrets.PACKAGE_UPLOAD_TOKEN }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IMAGE_TAG: ${{ steps.server_domain.outputs.server_domain }}/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
        run: |
          COMMENT_BODY="🐳 Dev image published: \`${IMAGE_TAG}\`

          \`\`\`bash
          docker pull ${IMAGE_TAG}
          \`\`\`"

          # Check if we already commented (avoid spam on synchronize)
          EXISTING=$(curl -s -H "Authorization: token ${TOKEN}" \
            "${SERVER}/api/v1/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            | grep -c "Dev image published" || true)

          if [ "$EXISTING" = "0" ]; then
            curl -s --fail -X POST \
              -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"body\": \"${COMMENT_BODY}\"}" \
              "${SERVER}/api/v1/repos/${REPO}/issues/${PR_NUMBER}/comments"
          fi
