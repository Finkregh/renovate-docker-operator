name: Build PR Image

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-container:
    uses: ./.github/workflows/reusable-build-image.yaml
    with:
      tag_suffixes: "pr-${{ github.event.pull_request.number }}"
    secrets: inherit

  comment:
    name: Comment image tag on PR
    runs-on: ubuntu-latest
    needs: build-container
    container:
      image: node:26-bookworm@sha256:a546d3f8acd2af4382668a7e6acd3bc4418e6a27478373e3246f8162f5181509

    steps:
      - name: Get server domain
        id: server_domain
        shell: bash
        run: |
          echo "server_domain=$(echo '${{ github.api_url }}' | awk -F'[/:]' '{print $4}')" >> "$GITHUB_OUTPUT"

      - name: Comment image tag on PR
        env:
          TOKEN: ${{ secrets.GLOBAL_COMMENT_TOKEN }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IMAGE_TAG: ${{ steps.server_domain.outputs.server_domain }}/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
        run: |
          API="${SERVER}/api/v1/repos/${REPO}/issues/${PR_NUMBER}/comments"
          COMMENT_BODY="🐳 Dev image published: \`${IMAGE_TAG}\`

          \`\`\`bash
          docker pull ${IMAGE_TAG}
          \`\`\`"

          # Encode with node: the body spans several lines, and a raw newline inside
          # a JSON string is invalid JSON — Forgejo then rejects the comment.
          PAYLOAD=$(node -e 'process.stdout.write(JSON.stringify({ body: process.argv[1] }))' "${COMMENT_BODY}")

          # Check if we already commented (avoid spam on synchronize)
          EXISTING=$(curl -s -H "Authorization: token ${TOKEN}" "${API}" \
            | grep -c "Dev image published" || true)

          if [ "${EXISTING}" = "0" ]; then
            curl -sS --fail-with-body -X POST \
              -H "Authorization: token ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d "${PAYLOAD}" \
              "${API}"
          else
            echo "Image tag comment already present, nothing to do"
          fi
