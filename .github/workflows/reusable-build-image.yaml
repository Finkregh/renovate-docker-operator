name: Build & Push Container Image

on:
  workflow_call:
    inputs:
      tag_suffixes:
        description: "Newline-separated tag suffixes (e.g. 'v1.0.0' or 'pr-42'). Each becomes {registry}/{repo}:{suffix}"
        required: true
        type: string
      checkout_ref:
        description: "Git ref to checkout (default: triggering ref)"
        required: false
        type: string
        default: ""
      fetch_tags:
        description: "Fetch git tags on checkout"
        required: false
        type: boolean
        default: false

jobs:
  build-container:
    name: Build & push container image
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm@sha256:8530f76a96d88820d288761f022e318970dda93d01536919fbc16076b7983e63
      options: >-
        --privileged

    steps:
      - name: Get server domain
        id: server_domain
        shell: bash
        run: |
          echo "server_domain=$(echo '${{ github.api_url }}' | awk -F'[/:]' '{print $4}')" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          REGISTRY="${{ steps.server_domain.outputs.server_domain }}"
          REPO="${{ github.repository }}"
          SUFFIXES="${{ inputs.tag_suffixes }}"

          TAGS=""
          while IFS= read -r suffix; do
            [ -z "$suffix" ] && continue
            if [ -n "$TAGS" ]; then
              TAGS="${TAGS}
          ${REGISTRY}/${REPO}:${suffix}"
            else
              TAGS="${REGISTRY}/${REPO}:${suffix}"
            fi
          done <<< "$SUFFIXES"

          # Use delimiter for multiline output
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: ${{ inputs.fetch_tags }}
          fetch-depth: ${{ inputs.fetch_tags && '0' || '1' }}
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Cache Podman APT archives
        uses: actions/cache@0c45773b623bea8c8e75f6c82b208c3cf94ea4f9 # v4.0.2
        with:
          path: /var/cache/apt/archives
          key: podman-apt-${{ runner.os }}-bookworm-v1

      - name: Install Podman
        run: |
          apt-get update
          apt-get install -y --no-install-recommends podman

      - name: Configure Podman storage
        run: |
          # A Forgejo job container has no outer Docker daemon. VFS is slower
          # than overlay but works reliably for a privileged nested Podman.
          mkdir -p /etc/containers
          cat > /etc/containers/storage.conf <<'EOF'
          [storage]
          driver = "vfs"
          EOF

      - name: Login to Container Registry
        env:
          REGISTRY: ${{ steps.server_domain.outputs.server_domain }}
          USERNAME: ${{ github.repository_owner }}
          PASSWORD: ${{ secrets.PACKAGE_UPLOAD_TOKEN }}
        run: printf '%s' "$PASSWORD" | podman login "$REGISTRY" --username "$USERNAME" --password-stdin

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION=$(git describe --tags "$(git rev-list --tags --max-count=1)" 2>/dev/null || echo "dev")
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          CACHE_IMAGE: ${{ steps.server_domain.outputs.server_domain }}/${{ github.repository }}:build-cache
        run: |
          build_tags=()
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            build_tags+=(--tag "$tag")
          done <<< "$TAGS"

          podman build --storage-driver=vfs --layers \
            --cache-from "$CACHE_IMAGE" \
            --cache-to "$CACHE_IMAGE" \
            "${build_tags[@]}" \
            --build-arg "VERSION=$VERSION" .
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            podman push --storage-driver=vfs "$tag"
          done <<< "$TAGS"
